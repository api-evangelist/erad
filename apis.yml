aid: erad
name: Erad
description: Erad is a licensed, Sharia-compliant fintech lender providing fast, flexible
  working capital to small and medium-sized businesses across Saudi Arabia and the
  United Arab Emirates. Founded in 2022 (Y Combinator S22) and headquartered in Riyadh,
  Erad offers revenue-based financing, invoice financing (advancing up to 90% of B2B/B2G
  invoices in as little as 48 hours), and supplier financing to revenue-generating
  SMEs. The company embeds working-capital products into supplier networks and business
  platforms, and is backed by investors including Y Combinator, 500 Global, Nuwa Capital,
  Khwarizmi Ventures, Aljazira Capital, VentureSouq, Oraseya Capital and Joa Capital,
  alongside debt facilities from Stride Ventures and a $125M asset-backed facility
  led by Jefferies with Channel Capital.
